<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>e-Cafe Campus</title>
    <style>
        /* Navigation bar */
        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }

        a:link {
            color: #1A5276;
        }

        a:visited {
            color: #7D3C98;
        }

        a:hover {
            color: #E67E22;
        }

        a:active {
            color: #C0392B;
        }

        h1 {
            text-decoration: overline;
        }

        p {
            color: #333333;
            text-align: justify;
        }

        .intro {
            font-size: 18px;
            background-color: #FDEBD0;
        }

        .highlight {
            font-weight: bold;
            color: #C0392B;
        }
    </style>
</head>

<!-- 
  Error 1 (Line 9): Invalid property value 'no' for list-style-type; should be 'none'.
  Error 2 (Lines 14-15): Incorrect pseudo-class order (a:visited placed after a:hover); a:hover must come after a:visited.
  Error 3 (Line 18): Missing colon ':' between 'color' and '#333333'.
  Error 4 (Line 22): Missing dot '.' for class selector 'highlight' (should be '.highlight').
  Error 5 (Line 34): Missing '#' symbol in href attribute ('menu' should be '#menu').
  Error 6 (Lines 42, 46): Duplicate id="item" used on multiple article elements; IDs must be unique (should be class="item").
  Error 7 (Line 53): Missing 'controls' attribute on the video tag.
  Error 8 (Line 54): Incorrect video source type attribute ('type="mp4"' should be 'type="video/mp4"').
-->

<body>
    <header>
        <h1>e-Cafe Campus</h1>
    </header>

    <nav>
        <ul>
            <li><a href="#menu">Menu</a></li>
            <li><a href="#video">Video</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <section id="menu">
        <h2>Today's Menu</h2>
        <p class="intro">Freshly brewed coffee and local delights everyday.</p>

        <article class="item">
            <h3>Kopi Tarik</h3>
            <p>Only <span class="highlight">RM 3.50</span></p>
        </article>

        <article class="item">
            <h3>Nasi Lemak</h3>
            <p>Only <span class="highlight">RM 5.00</span></p>
        </article>
    </section>

    <section id="video">
        <h2>Watch Our Story</h2>
        <video width="400" height="300" controls>
            <source src="cafe.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </section>

    <footer id="contact">
        <p>&copy; 2026 e-Cafe Campus</p>
    </footer>
</body>

</html>

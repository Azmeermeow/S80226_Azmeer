<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section id="Registration">
            <h1>Registration Form</h1>


            <form action="register.html" method="post">

                <label for="FullName">Full Name :</label>
                <input type="text" id="FullName" name="full name" required>
                <br><br>

                <label for="Matriks">Matriks :</label>
                <input type="text" id="Matriks" name="matriks" required>
                <br><br>

                <label for="Email">Email :</label>
                <input type="email" id="Email" name="email" required>
                <br><br>

                <p>Year Of Study:</p>

                <input type="radio" id="year1" name="year" value="Year 1">
                <label for="year1">Year 1</label>

                <input type="radio" id="year2" name="year" value="Year 2">
                <label for="year2">Year 2</label>

                <input type="radio" id="year3" name="year" value="Year 3">
                <label for="year3">Year 3</label>

                <input type="radio" id="year4" name="year" value="Year 4">
                <label for="year4">Year 4</label>
                <br><br>

                <p>Choose Sessions to Join:</p>

                <input type="checkbox" id="session1" name="Sessions" value="Programming">
                <label for="session1">Introduction to Programming</label>
                <br>

                <input type="checkbox" id="session2" name="sessions" value="HTML">
                <label for="session2">HTML Basics</label>
                <br>

                <input type="checkbox" id="session3" name="sessions" value="Challenge">
                <label for="session3">Mini Programming Challenge</label>

                <br><br>

                <label for="faculty">Programme / Faculty :</label>

                <select name="faculty" id="faculty" required>
                    <option value="">--Select Programme--</option>
                    <option value="Software Engineering">Software Engineering</option>
                    <option value="Data Analysis">Data Analysis</option>
                    <option value="Multimedia">Multimedia</option>
                </select>

                <br><br>

                <input type="submit" value="Submit">


            </form>
        </section>
</body>
</html>

<!DOCTYPE >
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Ticket Booking</title>
</head>
<body>
    <!--
    Error 1 (Line 1): Incomplete DOCTYPE declaration (<!DOCTYPE> should be <!DOCTYPE html>)
    Error 2 (Line 9): Incorrect tag nesting in <h1> and <span>
    Error 3 (Line 11): Used inline <span> element for #content to wrap block elements instead of <div>
    Error 4 (Line 13): Unescaped less-than sign (<) and unclosed entity (&amp instead of &amp;)
    Error 5 (Line 14): oninput attribute performs string concatenation instead of numeric addition
    Error 6 (Line 18): Typo in input type attribute ("emial" instead of "email")
    Error 7 (Line 22, 23): Mismatched datalist id and list attribute ("movies" vs "movielist")
    Error 8 (Line 32): Invalid range min and max values (min="5" max="1" should be min="1" max="5")
    Error 9 (Line 33): Incorrect output 'for' attribute ("adult kid" should be "adult child")

    Error 11 (Lines 41, 55): Extraneous and duplicate trailing closing tags

<div id="header">
    <h1>e-Ticket <span>Your Campus Cinema</h1></span>
</div>
<span id="content">
    <h2>Book Your Ticket</h2>
    <p>Promotion: tickets < RM10 for students &amp staff!</p>
    <form action="booking.php" oninput="total.value = adult.value + child.value">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required autofocus><br>
        <label for="email">E-mail:</label>
        <input type="emial" id="email" name="email"><br>
        <label for="date">Show date:</label>
        <input type="date" id="date" name="date"><br>
        <label for="movie">Movie:</label>
        <input id="movie" name="movie" list="movies"><br>
        <datalist id="movielist">
            <option value="Space Rangers">
            <option value="Kampung Comedy">
        </datalist>
        <label for="adult">Adult tickets:</label>
        <input type="number" id="adult" name="adult" value="0"><br>
        <label for="child">Child tickets:</label>
        <input type="number" id="child" name="child" value="0"><br>
        <label for="rating">Rate our service:</label>
        <input type="range" id="rating" name="rating" min="5" max="1"><br>
        Total tickets: <output name="total" for="adult kid"></output><br>
        <input type="submit" value="Book Now">
    </form>
</span>

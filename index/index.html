
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My World</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url('nature.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            font-family: Arial, sans-serif;
            color: white;

            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: -1;
        }

        .container {
            width: 90%;
            max-width: 600px;
            padding: 45px 30px;

            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;

            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 36px;
            letter-spacing: 3px;
            margin-bottom: 25px;
            text-shadow: 2px 2px 5px black;
        }

        h2 {
            font-size: 16px;
            margin: 12px 0;
            font-weight: normal;
            letter-spacing: 1px;
        }

        .line {
            width: 80px;
            height: 3px;
            background: #a8e6a3;
            margin: 25px auto;
            border-radius: 10px;
        }

        .links {
            margin-top: 20px;
        }

        .links a {
            display: block;
            color: white;
            text-decoration: none;

            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);

            padding: 13px;
            margin: 12px 0;
            border-radius: 10px;

            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        .links a:hover {
            background: #a8e6a3;
            color: #183b22;
            transform: scale(1.05);
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #dddddd;
            letter-spacing: 1px;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>WELCOME TO MY WORLD</h1>

        <div class="line"></div>

        <h2>NAME: MUHAMMAD AZMEER SYAFIQ BIN AHMAD</h2>

        </div>

        <div class="footer">
            © 2026 MY PERSONAL WEBSITE
        </div>

    </div>

</body>
</html>
